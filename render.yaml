services:
  - type: web
    name: lavsofa
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: "lavsofa-media"
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "lavsofarj.com.br,www.lavsofarj.com.br"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://lavsofarj.com.br,https://www.lavsofarj.com.br"
      - key: SITE_URL
        value: "https://lavsofarj.com.br"
      - key: WHATSAPP_NUMBER
        value: "5521966069772"
      - key: INSTAGRAM_URL
        value: "https://www.instagram.com/lavsofa.rj/"
